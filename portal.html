<!doctype html>
<html lang="pl">
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="styles.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    </head>
    <body>
        <header>
            <span style='color: blue'>N</span>
            <span style='color: red'>A</span>
            <span style='color: yellow'>U</span>
            <span style='color: blue'>K</span>
            <span style='color: green'>A</span>
            <span style='color: yellow'>M</span>
            <span style='color: blue'>A</span>
            <span style='color: red'>T</span>
            <span style='color: green'>E</span>
            <span style='color: yellow'>M</span>
            <span style='color: green'>A</span>
            <span style='color: red'>T</span>
            <span style='color: blue'>Y</span>
            <span style='color: red'>K</span>
            <span style='color: yellow'>I</span>
        </header>

    <main>
        <nav>
            <button id="dodawanie">Dodawanie</button>
            <button id="odejmowanie">Odejmowanie</button>
            <button id="mnozenie">Mnożenie</button>
            <button id="dzielenie">Dzielenie</button>
        </nav>

        <div id="pole">
            WYBIERZ ZAKŁADKĘ
        </div>


    </main>

        <script>
            const pole= document.getElementById("pole");
            let x, y, wynik, aktualnyTyp;

            function losuj(typ) {
                let znak = "";
                aktualnyTyp = typ;

                switch (typ){
                    case 'dodawanie':
                        x = Math.floor(Math.random() * 101);
                        y = Math.floor(Math.random() * 101);
                        wynik = x + y;
                        znak = "+";
                        break;

                    case 'odejmowanie':
                        x = Math.floor(Math.random() * 101);
                        y = Math.floor(Math.random() * 101);
                        wynik = x - y;
                        znak = "-";
                        break;

                    case 'mnozenie':
                        x = Math.floor(Math.random() * 16);
                        y = Math.floor(Math.random() * 16);
                        wynik = x * y;
                        znak = "*";
                        break;

                    case 'dzielenie':
                        x = Math.floor(Math.random() * 16);
                        y = Math.floor(Math.random() * 14)+1;
                        wynik = x/y;
                        znak = "/"
                        break;
                }
                pole.innerHTML = x + znak + y + " = <input type='number' id='wpisane'>" +
                "<button onclick='sprawdz()' class='btn'>Sprawdź</button> " +
                "<button onclick='losuj(\"" +typ +"\")' class='btn'>Losuj</button>";
            }

            document.getElementById("dodawanie").onclick = () => losuj('dodawanie');
            document.getElementById("odejmowanie").onclick = () => losuj('odejmowanie');
            document.getElementById("mnozenie").onclick = () => losuj('mnozenie');
            document.getElementById("dzielenie").onclick = () => losuj('dzielenie');

            function sprawdz() {
                const wpisane = document.getElementById("wpisane").value;

                if (Number(wpisane) === wynik) {
                    alert('Wpisałeś dobry wynik!');
                } 
                else {
                    alert('Wpisałeś zły wynik! Poprawny to: ' + wynik);
                }
                losuj(aktualnyTyp);
                }
        </script>

        <footer>
            Lenart Kołtun
        </footer>
    </body>
</html>
